        <h2>Locked in! ⚡</h2><p>You answered in about <b style="color:var(--ink)">${sec}s</b>. Waiting for the timer to finish…</p></div></div>`;
      return runTick(() => timeUp(`Your answer is locked in — you answered in about <b style="color:var(--ink)">${sec}s</b>.`));
    }
    if (left() <= 0) return s.mode === 'buzzer' ? timeUpBuzz() : timeUp("You didn't answer this one in time.");
    function timeUpBuzz() { am.innerHTML = `<div class="card aud-card">${head(s)}<div class="ff-state"><span class="em">⏰</span><h2>Buzzers closed!</h2><p>You didn't buzz in this round. Watch the big screen 👀</p></div></div>`; }
    let sending = false;
    const sendFF = async (data, els) => {
      if (sending) return; if (left() <= 0) { stopTick(); return timeUp("You didn't answer this one in time."); }
      sending = true; els.forEach(e => e.disabled = true);
      const ms = Math.max(0, Store.now() - fs.start);
      try { await Store.addResponse(code, s.id, { ...data, name }); LS.set(vk, String(ms)); stopTick(); fff(s, reset); }
      catch (e) { console.error(e); toast('Could not send — try again', 'err'); sending = false; els.forEach(e => e.disabled = false); }
    };
    if (s.mode === 'mc') {
      am.innerHTML = `<div class="card aud-card">${head(s)}${who(false)}${clock}
        ${s.options.map((o, i) => `<button class="opt" data-i="${i}"><span class="lt" style="background:${PALETTE[i % PALETTE.length]}">${String.fromCharCode(65 + i)}</span>${esc(o)}</button>`).join('')}
        <p class="muted" style="font-weight:800;text-align:center;font-size:13px">Tap once — your first tap is your answer</p></div>`;
      const btns = $$('.opt', am);
      btns.forEach(b => b.onclick = () => { b.classList.add('sel'); sendFF({ choice: +b.dataset.i }, btns); });
    } else if (s.mode === 'buzzer') {
      am.innerHTML = `<div class="card aud-card">${head(s)}${who(false)}${clock}
        <button class="bzr" id="bz" aria-label="Buzzer — press as fast as you can">${buzzerSVG()}</button>
        <div class="bzr-hint">Hit the buzzer!</div></div>`;
      const bz = $('#bz');
      const hit = e => { e.preventDefault(); if (bz.disabled) return; bz.classList.add('hit'); try { navigator.vibrate && navigator.vibrate(80); } catch {} sendFF({ buzz: true }, [bz]); };
      bz.addEventListener('pointerdown', hit); bz.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') hit(e); });
    } else if (s.mode === 'order') {
      const pieces = s.items || [], bank = fffShuffle(pieces.length, hashStr(vid + s.id)), picked = [], steps = s.arrange === 'steps';
      am.innerHTML = `<div class="card aud-card">${head(s)}${who(false)}${clock}
        <div class="ord-lbl">Your ${steps ? 'sequence' : 'sentence'}</div>
        <div class="ord-ans ${steps ? 'steps' : ''}" id="ordAns" data-ph="Tap the ${steps ? 'steps' : 'words'} below in the right order…"></div>
        <div class="ord-tools"><button class="btn sm ghost" id="ordClr">↺ Clear</button></div>
        <div class="ord-bank" id="ordBank"></div>
        <button class="btn navy submit" id="ffGo" disabled>Submit ⚡</button></div>`;
      const go2 = $('#ffGo');
      const draw = () => {
        $('#ordAns').innerHTML = picked.map((i, k) => `<button class="chip placed" data-out="${k}">${steps ? `<i>${k + 1}</i>` : ''}${esc(pieces[i])}</button>`).join('');
        $('#ordBank').innerHTML = bank.filter(i => !picked.includes(i)).map(i => `<button class="chip" data-in="${i}">${esc(pieces[i])}</button>`).join('');
        go2.disabled = picked.length !== pieces.length;
        $$('[data-in]', am).forEach(b => b.onclick = () => { picked.push(+b.dataset.in); draw(); });
        $$('[data-out]', am).forEach(b => b.onclick = () => { picked.splice(+b.dataset.out, 1); draw(); });
      };
      draw();
      $('#ordClr').onclick = () => { picked.length = 0; draw(); };
      go2.onclick = () => { if (picked.length === pieces.length) sendFF({ order: [...picked] }, [go2]); };
    } else {
      am.innerHTML = `<div class="card aud-card">${head(s)}${who(false)}${clock}
        ${s.mode === 'open' ? `<textarea class="input" id="ffIn" maxlength="200" rows="3" placeholder="Type your answer…" style="font-size:17px;padding:14px"></textarea>`
          : `<input class="input" id="ffIn" maxlength="60" placeholder="Type your answer…" autocomplete="off" style="font-size:18px;padding:14px">`}
        <button class="btn navy submit" id="ffGo" disabled>Submit ⚡</button></div>`;
      const inp = $('#ffIn'), go2 = $('#ffGo'); inp.focus();
      inp.oninput = () => { go2.disabled = !inp.value.trim(); };
      const fire = () => { const v = inp.value.trim(); if (v) sendFF({ text: v }, [inp, go2]); };
      go2.onclick = fire; inp.onkeydown = e => { if (e.key === 'Enter' && !(s.mode === 'open' && e.shiftKey)) { e.preventDefault(); fire(); } };
    }
    runTick(() => { if (!LS.get(vk)) s.mode === 'buzzer' ? timeUpBuzz() : timeUp("You didn't answer this one in time."); });
  }
  // After pressing the buzzer: show this person's live position in the buzz order
  function buzzed(s, fs, ms, left, runTick) {
    const lim = fffLimit(s);
    $('#am').innerHTML = `<div class="card aud-card">${head(s)}
      ${left() > 0 ? `<div class="ff-clock"><div class="ff-track"><div class="ff-fill" id="ffBar" style="width:${Math.max(0, left() / lim * 100)}%"></div></div><b id="ffSec">${Math.max(0, Math.ceil(left() / 1000))}s</b></div>` : ''}
      <div class="ff-state" style="padding:6px 0 14px"><div class="bzr small hit on" style="pointer-events:none">${buzzerSVG()}</div><h2 id="bzHead" style="margin-top:8px">${left() > 0 ? 'Buzzed!' : 'Buzzers closed!'}</h2>
      <p>You pressed in about <b style="color:var(--ink)">${(ms / 1000).toFixed(2)}s</b></p>
      <div class="bz-pos" id="bzPos">…</div><p id="bzMsg">Checking your place…</p></div></div>`;
    unsubQA = Store.watchResponses(code, s.id, list => {
      const ranked = fffRanked(s, list, fs.start || 0), idx = ranked.findIndex(r => r.voter === vid);
      const pos = $('#bzPos'), msg = $('#bzMsg'); if (!pos) return;
      if (idx < 0) { pos.textContent = '…'; return; }
      pos.textContent = '#' + (idx + 1) + (idx < 3 ? ' ' + ['🥇', '🥈', '🥉'][idx] : '');
      msg.innerHTML = idx === 0 ? '<b style="color:var(--ink)">You were first!</b> Get ready to answer 🎤' : `${idx} ${idx === 1 ? 'person' : 'people'} buzzed before you`;
    });
    if (left() > 0) runTick(() => { const h = $('#bzHead'); if (h) h.textContent = 'Buzzers closed!'; $('.ff-clock')?.remove(); });
  }
  function fffResults(s, fs) {
    const am = $('#am');
    am.innerHTML = `<div class="card aud-card">${head(s)}<div id="ffRes">${loader()}</div></div>`;
    unsubQA = Store.watchResponses(code, s.id, list => {
      const el = $('#ffRes'); if (!el) return;
      const ranked = fffRanked(s, list, fs.start || 0), idx = ranked.findIndex(r => r.voter === vid), me = ranked[idx];
      const ct = fffCorrectText(s);
      el.innerHTML = `${me ? `<div class="ff-me">You finished<b>#${idx + 1}${idx < 3 ? ' ' + ['🥇', '🥈', '🥉'][idx] : ''}</b>
          <span class="muted" style="font-weight:800">${esc(fffAnswer(s, me.data))}${me.ms !== null ? ' · ' + (me.ms / 1000).toFixed(2) + 's' : ''}${me.ok === true ? ' · ✓ correct' : me.ok === false ? ' · ✗ wrong' : ''}</span></div>`
        : `<div class="ff-me" style="font-weight:800;color:var(--muted)">You didn't answer this round in time ⏰</div>`}
        ${ct ? `<div style="text-align:center"><span class="ff-correct">✓ ${esc(ct)}</span></div>` : ''}
        <h4 style="margin:4px 0 10px;font-size:18px">🏆 Leaderboard</h4>${fffBoard(s, ranked, { me: vid, max: 10 })}`;
    });
  }

  function votedKey(s, reset) { return `mm_v_${code}_${s.id}_${reset}`; }
  function head(s) {
    return `<div class="progress">${p.slides.map((_, i) => `<i class="${i === (p.current || 0) ? 'on' : ''}"></i>`).join('')}</div>
      <span class="q-chip">${ticon(s.type)} ${TYPES[s.type].name}</span><h2 class="q-title">${esc(s.question)}</h2>`;
  }
  function thanks(s, reset, again) {
    $('#am').innerHTML = `<div class="card aud-card"><div class="thanks"><div class="check"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
      <h2>Answer sent! 🎉</h2><p>Keep your eyes on the big screen <span class="dots"><i></i><i></i><i></i></span></p>
      ${again ? `<button class="btn primary" id="again" style="margin-top:20px">＋ Submit another answer</button>` : ''}</div></div>`;
    if (again) $('#again').onclick = () => form(s, reset, true);
  }
  function paint(s, reset) {
    if (s.type === 'qa') return qa(s);
    if (s.type === 'fff') return fff(s, reset);
    if (s.type === 'blank') { $('#am').innerHTML = `<div class="card aud-card wel-card">${welcomeHTML(p.title)}
      <div class="wel-wait">⏳ ${esc(s.message || 'Wait for the next question')} <span class="dots"><i></i><i></i><i></i></span></div></div>`; return; }
    if (p.locked) { $('#am').innerHTML = `<div class="card aud-card">${head(s)}<div class="locked-note">🔒 Voting is closed for this question.</div><p class="muted" style="font-weight:700">Wait for the presenter to open the next one.</p></div>`; return; }
    if (LS.get(votedKey(s, reset))) return thanks(s, reset, s.type === 'open' && s.multi);
    form(s, reset);
  }
  async function send(s, reset, data, btn) {
    btn.disabled = true; btn.textContent = 'Sending…';
    try { await Store.addResponse(code, s.id, data); LS.set(votedKey(s, reset), '1'); thanks(s, reset, s.type === 'open' && s.multi); }
    catch (e) { console.error(e); toast('Could not send — try again', 'err'); btn.disabled = false; btn.textContent = 'Submit'; }
  }
  function form(s, reset) {
    const am = $('#am'); let body = '';
    const btn = `<button class="btn navy submit" id="sub">Submit</button>`;
    switch (s.type) {
      case 'mc': body = `${s.multi ? '<p class="muted" style="font-weight:800;margin:-12px 0 14px">Select all that apply</p>' : ''}
        ${s.options.map((o, i) => `<button class="opt" data-i="${i}"><span class="lt" style="background:${PALETTE[i % PALETTE.length]}">${String.fromCharCode(65 + i)}</span>${esc(o)}</button>`).join('')}${btn}`; break;
      case 'wordcloud': body = `${Array.from({ length: s.maxWords }, (_, i) => `<input class="input wc-in" maxlength="25" placeholder="Word ${i + 1}" style="margin-bottom:10px;font-size:17px;padding:14px">`).join('')}${btn}`; break;
      case 'open': body = `<textarea class="input" id="ot" maxlength="250" rows="5" placeholder="Type your answer…" style="font-size:16.5px"></textarea>
        <div class="muted" style="text-align:right;font-weight:800;font-size:12.5px;margin-top:4px"><span id="oc">0</span>/250</div>${btn}`; break;
      case 'scales': body = s.statements.map((st, i) => { const mid = Math.round((s.min + s.max) / 2); return `<div class="rng-row"><div class="rng-head"><span>${esc(st)}</span><b data-o="${i}">${mid}</b></div>
        <input type="range" class="range" data-r="${i}" min="${s.min}" max="${s.max}" step="1" value="${mid}"><div class="rng-ends"><span>${esc(s.minLabel)}</span><span>${esc(s.maxLabel)}</span></div></div>`; }).join('') + btn; break;
      case 'ranking': body = `<p class="muted" style="font-weight:800;margin:-12px 0 14px">Use the arrows — top = most important</p><div id="rkl"></div>${btn}`; break;
      case 'guess': { const mid = Math.round((s.min + s.max) / 2); body = `<div class="big-num" id="gv">${mid}</div>
        <div class="stepper"><button id="gm">−</button><input type="range" class="range" id="gr" min="${s.min}" max="${s.max}" step="1" value="${mid}"><button id="gp">＋</button></div>
        <div class="rng-ends" style="margin:6px 52px 0"><span>${s.min}</span><span>${s.max}</span></div>${btn}`; break; }
      case 'points': body = `<div class="budget"><span>Points left</span><b id="left">${s.budget}</b></div>` + s.items.map((it, i) => `<div class="rng-row"><div class="rng-head"><span>${esc(it)}</span><b data-o="${i}">0</b></div>
        <input type="range" class="range" data-r="${i}" min="0" max="${s.budget}" step="1" value="0"></div>`).join('') + btn; break;
      case 'grid': body = s.items.map((it, i) => `<div class="grid-item"><h5><span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:${PALETTE[i % PALETTE.length]};margin-right:8px"></span>${esc(it)}</h5>
        ${['x', 'y'].map(ax => { const mid = Math.round((s.gmin + s.gmax) / 2); return `<div class="rng-head" style="font-size:14px"><span>${esc(ax === 'x' ? s.xLabel : s.yLabel)}</span><b data-o="${ax}${i}">${mid}</b></div>
        <input type="range" class="range" data-g="${ax}${i}" min="${s.gmin}" max="${s.gmax}" step="1" value="${mid}">`; }).join('')}</div>`).join('') + btn; break;
      case 'form': body = s.fields.map((f, i) => `<div class="field"><label>${esc(f.label)}${f.req ? ' *' : ''}</label>
        ${f.type === 'textarea' ? `<textarea class="input" data-fi="${i}" maxlength="400" rows="3"></textarea>` : `<input class="input" data-fi="${i}" type="${f.type}" maxlength="120">`}</div>`).join('') + btn; break;
      case 'pin': body = `<p class="muted" style="font-weight:800;margin:-12px 0 14px">Tap the image to drop your pin 📍</p>
        <div style="text-align:center"><div class="pin-wrap pin-pick" id="pw"><img src="${esc(s.image)}" alt="" draggable="false"></div></div>${btn}`; break;
    }
    am.innerHTML = `<div class="card aud-card">${head(s)}${body}</div>`;
    const sub = $('#sub');
    const submit = data => send(s, reset, data, sub);
    switch (s.type) {
      case 'mc': { const sel = new Set(); sub.disabled = true;
        $$('.opt', am).forEach(b => b.onclick = () => { const i = +b.dataset.i;
          if (s.multi) sel.has(i) ? sel.delete(i) : sel.add(i); else { sel.clear(); sel.add(i); }
          $$('.opt', am).forEach(x => x.classList.toggle('sel', sel.has(+x.dataset.i))); sub.disabled = !sel.size; });
        sub.onclick = () => submit({ choices: [...sel] }); break; }
      case 'wordcloud': { const ins = $$('.wc-in', am); sub.disabled = true;
        ins.forEach(i => i.oninput = () => { i.value = i.value.replace(/\s+/g, ' ').replace(/^\s/, ''); sub.disabled = !ins.some(x => x.value.trim()); });
        ins[0].focus(); sub.onclick = () => submit({ words: ins.map(i => i.value.trim()).filter(Boolean) }); break; }
      case 'open': { const t = $('#ot'); sub.disabled = true; t.focus();
        t.oninput = () => { $('#oc').textContent = t.value.length; sub.disabled = !t.value.trim(); };
        sub.onclick = () => submit({ text: t.value.trim() }); break; }
      case 'scales': {
        $$('[data-r]', am).forEach(r => r.oninput = () => $(`[data-o="${r.dataset.r}"]`, am).textContent = r.value);
        sub.onclick = () => submit({ values: $$('[data-r]', am).map(r => Number(r.value)) }); break; }
      case 'ranking': { const order = [...s.items.keys()];
        const draw = () => { $('#rkl').innerHTML = order.map((it, pos) => `<div class="rk-item"><span class="n">${pos + 1}</span><span>${esc(s.items[it])}</span>
          <button data-mv="${pos}" data-d="-1" ${pos === 0 ? 'disabled' : ''}>▲</button><button data-mv="${pos}" data-d="1" ${pos === order.length - 1 ? 'disabled' : ''}>▼</button></div>`).join('');
          $$('[data-mv]', am).forEach(b => b.onclick = () => { const a = +b.dataset.mv, c = a + +b.dataset.d; [order[a], order[c]] = [order[c], order[a]]; draw(); }); };
        draw(); sub.onclick = () => submit({ order: [...order] }); break; }
      case 'guess': { const r = $('#gr'), v = $('#gv'); const set = n => { r.value = clamp(n, s.min, s.max); v.textContent = r.value; };
        r.oninput = () => set(+r.value); $('#gm').onclick = () => set(+r.value - 1); $('#gp').onclick = () => set(+r.value + 1);
        sub.onclick = () => submit({ value: Number(r.value) }); break; }
      case 'points': { const rs = $$('[data-r]', am);
        const upd = changed => { let sum = rs.reduce((a, r) => a + +r.value, 0);
          if (sum > s.budget && changed) { changed.value = +changed.value - (sum - s.budget); sum = s.budget; }
          rs.forEach(r => $(`[data-o="${r.dataset.r}"]`, am).textContent = r.value);
          $('#left').textContent = s.budget - sum; sub.disabled = sum === 0; sub.textContent = sum < s.budget ? `Submit (${s.budget - sum} unused)` : 'Submit'; };
        rs.forEach(r => r.oninput = () => upd(r)); upd();
        sub.onclick = () => submit({ points: rs.map(r => Number(r.value)) }); break; }
      case 'grid': {
        $$('[data-g]', am).forEach(r => r.oninput = () => $(`[data-o="${r.dataset.g}"]`, am).textContent = r.value);
        sub.onclick = () => submit({ xy: s.items.map((_, i) => ({ x: Number($(`[data-g="x${i}"]`, am).value), y: Number($(`[data-g="y${i}"]`, am).value) })) }); break; }
      case 'form': sub.onclick = () => {
        const ins = $$('[data-fi]', am); const vals = ins.map(i => i.value.trim());
        const miss = ins.find((i, k) => s.fields[k].req && !vals[k]); if (miss) { miss.focus(); miss.classList.remove('shake'); void miss.offsetWidth; miss.classList.add('shake'); return toast('Please fill the required fields', 'err'); }
        const bad = ins.find(i => i.type === 'email' && i.value && !i.checkValidity()); if (bad) { bad.focus(); return toast('Check the email format', 'err'); }
        if (!vals.some(Boolean)) return toast('Fill in at least one field', 'err');
        submit({ values: vals }); }; break;
      case 'pin': { const w = $('#pw'); let pos = null; sub.disabled = true;
        w.onclick = e => { const r = w.getBoundingClientRect(); pos = { x: +((e.clientX - r.left) / r.width * 100).toFixed(2), y: +((e.clientY - r.top) / r.height * 100).toFixed(2) };
          $('.pin-dot', w)?.remove(); w.insertAdjacentHTML('beforeend', `<i class="pin-dot pop" style="left:${pos.x}%;top:${pos.y}%"></i>`); sub.disabled = false; };
        sub.onclick = () => pos && submit(pos); break; }
    }
  }
  function qa(s) {
    const am = $('#am');
    am.innerHTML = `<div class="card aud-card">${head(s)}
      ${p.locked ? '<div class="locked-note">🔒 New questions are paused — you can still upvote.</div>' : `<div class="qa-mine"><input class="input" id="qin" maxlength="200" placeholder="Ask anonymously…"><button class="btn navy" id="qgo">Ask</button></div>`}
      <div id="qlist"></div></div>`;
    const qin = $('#qin');
    if (qin) { const ask = async () => { const t = qin.value.trim(); if (!t) return; $('#qgo').disabled = true;
        try { await Store.addResponse(code, s.id, { text: t }); qin.value = ''; toast('Question sent! 🙌', 'ok'); } catch { toast('Could not send', 'err'); }
        $('#qgo').disabled = false; };
      $('#qgo').onclick = ask; qin.onkeydown = e => { if (e.key === 'Enter') ask(); }; }
    unsubQA = Store.watchResponses(code, s.id, list => {
      const el = $('#qlist'); if (!el) return;
      const sorted = [...list].sort((a, b) => (a.answered - b.answered) || ((b.up || []).length - (a.up || []).length) || a.ts - b.ts);
      el.innerHTML = sorted.length ? `<div class="qa-list" style="max-height:none">${sorted.map(r => { const on = (r.up || []).includes(vid);
        return `<div class="qa-item ${r.answered ? 'done' : ''}" style="box-shadow:none;border-color:#EADDCB"><button class="upv ${on ? 'on' : ''}" data-up="${r.id}" data-has="${on ? 1 : 0}"><span>▲</span>${(r.up || []).length}</button>
          <div class="qa-text" style="font-size:15.5px">${esc(r.data.text)}${r.voter === vid ? ' <span class="tag" style="font-size:10px;padding:2px 7px">yours</span>' : ''}${r.answered ? ' <span class="tag" style="font-size:10px;padding:2px 7px;background:#DBF8EE">answered</span>' : ''}</div></div>`; }).join('')}</div>`
        : `<div class="empty-res" style="font-size:15px"><span class="bounce">🙋</span>No questions yet — be the first!</div>`;
      $$('[data-up]', el).forEach(b => b.onclick = () => Store.toggleUpvote(code, b.dataset.up, vid, b.dataset.has === '1'));
    });
  }
}

/* =====================================================================
   14. BOOT
   ===================================================================== */
(async () => {
  try { await Store.init(); }
  catch (e) { console.error(e); app.innerHTML = `<div class="join-card card"><h1>Connection error</h1><p class="muted">Could not connect to Firebase Realtime Database. Check CONFIG.firebaseConfig and databaseURL.</p></div>`; return; }
  addEventListener('hashchange', route);
  route();
})();
</script>
</body>
</html>

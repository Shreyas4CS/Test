<!--
=====================================================================
  MENTI-MENTOR by CognoSpace  —  single-file live polling app
  ---------------------------------------------------------------
  * Works out of the box in DEMO MODE (localStorage + BroadcastChannel):
    open Presenter in one tab and User mode in another tab of the SAME
    browser to see live voting.
  * Multi-device sync uses Firebase REALTIME DATABASE. Set
    CONFIG.USE_FIREBASE = true, paste your web config into
    CONFIG.firebaseConfig and make sure databaseURL matches the URL shown
    on Realtime Database → Data.
  * Change the presenter password: put the SHA-256 hex of your new
    password into CONFIG.PRESENTER_PASSWORD_SHA256.
  * Use your real logo: set CONFIG.LOGO_URL to an image URL.
=====================================================================
-->
<style>
:root{
  --navy:#1B2559;--navy2:#2B3674;--ink:#1B2559;--muted:#6B7394;
  --orange:#FF7A1A;--amber:#FFB020;--pink:#FF5D8F;--mint:#19C79A;--sky:#3BA9FF;--violet:#7C5CFF;--yellow:#FFD23F;
  --bg:#FFF8F0;--card:#FFFFFF;--line:#F0E4D4;--soft:#FFF1E2;
  --r:20px;--sh:5px 5px 0 var(--navy);--sh-sm:3px 3px 0 var(--navy);
  --spring:cubic-bezier(.2,.9,.3,1.25);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Nunito',system-ui,sans-serif;color:var(--ink);background:var(--bg);min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3,h4,.display{font-family:'Fredoka',sans-serif;font-weight:600;letter-spacing:-.01em;line-height:1.1}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;color:inherit}
a{color:inherit;text-decoration:none}
::selection{background:var(--yellow)}

/* ---------- Buttons / basics ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:14px;font-weight:800;font-size:15px;border:2px solid var(--navy);box-shadow:var(--sh-sm);background:#fff;white-space:nowrap;transition:transform .15s,box-shadow .15s,background .2s}
.btn:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--navy)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--navy)}
.btn.primary{background:var(--orange);color:#fff}
.btn.navy{background:var(--navy);color:#fff}
.btn.mint{background:var(--mint);color:#fff}
.btn.pink{background:var(--pink);color:#fff}
.btn.yellow{background:var(--yellow)}
.btn.ghost{border-color:transparent;box-shadow:none;background:transparent}
.btn.ghost:hover{background:var(--soft);transform:none;box-shadow:none}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:11px}
.btn.icon{padding:9px;border-radius:12px}
.btn.on{background:var(--yellow)}
.btn:disabled{opacity:.45;pointer-events:none}
.btn svg{width:18px;height:18px;flex:none}
.card{background:var(--card);border:2px solid var(--navy);border-radius:var(--r);box-shadow:var(--sh)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field>label,.lbl{font-size:11.5px;font-weight:900;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.input{width:100%;padding:11px 14px;border:2px solid #E6D9C8;border-radius:12px;background:#fff;font-size:15px;font-weight:700;outline:none;transition:border-color .2s,box-shadow .2s}
.input:focus{border-color:var(--orange);box-shadow:0 0 0 4px rgba(255,122,26,.15)}
textarea.input{resize:vertical;min-height:90px;line-height:1.45}
.row{display:flex;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;align-items:center;gap:10px;font-weight:800;cursor:pointer;margin-bottom:14px;font-size:14px}
.chk input{width:20px;height:20px;accent-color:var(--orange)}
.tag{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;font-size:12px;font-weight:900;border:2px solid var(--navy);background:#fff}
.ticon{display:inline-grid;place-items:center;width:30px;height:30px;flex:none}
.ticon svg{width:100%;height:100%;fill:currentColor}
.hidden{display:none!important}
.muted{color:var(--muted)}

/* ---------- Logo ---------- */
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand-link{display:block;flex:none;transition:transform .2s var(--spring)}
.brand-link:hover{transform:scale(1.04)}
.brand-logo{height:44px;width:auto;display:block}
.brand-sub{font-family:Fredoka;font-weight:700;font-size:24px;letter-spacing:-.01em;color:var(--orange);padding-left:14px;border-left:2px solid var(--line);line-height:1.1;white-space:nowrap;cursor:pointer}
.brand.light{background:#fff;padding:8px 14px;border-radius:14px;border:2px solid var(--orange);display:inline-flex}
@media (max-width:520px){.brand{gap:10px}.brand .brand-logo{height:36px}.brand-sub{font-size:17px;padding-left:10px}
  .aud-top .brand-sub{display:none}.nav .wrap{flex-wrap:wrap;row-gap:10px}.mf-mode{display:none}}
.brand-mark{width:42px;height:42px;flex:none}
.brand-mark img{width:100%;height:100%;object-fit:contain}
.brand-text{display:flex;flex-direction:column;line-height:1}
.brand-text b{font-family:'Fredoka';font-weight:700;font-size:21px;letter-spacing:-.01em}
.brand-text b span{color:var(--orange)}
.brand-text small{font-size:10.5px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.brand.light .brand-text b{color:#fff}.brand.light .brand-text small{color:#FFC999}

/* ---------- Toasts / modal ---------- */
#toasts{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--navy);color:#fff;padding:12px 18px;border-radius:14px;font-weight:800;box-shadow:0 10px 30px rgba(27,37,89,.3);animation:toastIn .45s var(--spring)}
.toast.err{background:var(--pink)}.toast.ok{background:var(--mint)}
@keyframes toastIn{from{opacity:0;transform:translateY(20px) scale(.9)}}
.modal-bg{position:fixed;inset:0;background:rgba(27,37,89,.45);backdrop-filter:blur(6px);z-index:1000;display:grid;place-items:center;padding:20px;animation:fade .25s}
.modal{width:min(480px,100%);max-height:90vh;overflow:auto;padding:28px;animation:modalIn .45s var(--spring)}
.modal.wide{width:min(860px,100%)}
.modal h3{font-size:26px;margin-bottom:6px}
.modal p.sub{color:var(--muted);font-weight:600;margin-bottom:20px}
@keyframes fade{from{opacity:0}}
@keyframes modalIn{from{opacity:0;transform:translateY(30px) scale(.94)}}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

/* ---------- Landing ---------- */
.nav{position:sticky;top:0;z-index:50;padding:14px 0;background:rgba(255,248,240,.82);backdrop-filter:blur(12px);border-bottom:2px solid transparent;transition:border-color .3s}
.nav.scrolled{border-color:var(--line)}
.wrap{width:min(1180px,100% - 40px);margin:0 auto}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px}
.nav-links{display:flex;gap:6px;align-items:center}
.nav-links a{padding:8px 14px;border-radius:10px;font-weight:800;font-size:15px;transition:background .2s}
.nav-links a:hover{background:var(--soft)}
.hero{position:relative;padding:60px 0 90px;overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:50px;align-items:center}
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55;z-index:-1;animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(40px,-30px) scale(1.12)}}
.pill{display:inline-flex;align-items:center;gap:8px;padding:7px 14px 7px 8px;background:#fff;border:2px solid var(--navy);border-radius:999px;font-weight:800;font-size:13.5px;box-shadow:var(--sh-sm);animation:rise .7s var(--spring) both}
.pill i{width:24px;height:24px;border-radius:50%;background:var(--mint);display:grid;place-items:center;color:#fff;font-style:normal;font-size:12px}
.hero h1{font-size:clamp(30px,3.6vw,46px);margin:6px 0 18px;animation:rise .7s .14s var(--spring) both;color:var(--navy)}
.bigname{display:block;font-family:Fredoka;font-weight:700;font-size:clamp(46px,5.8vw,84px);line-height:1;letter-spacing:-.02em;margin-top:22px;white-space:nowrap;
  background:linear-gradient(90deg,#FF8A00,#FF5D8F 45%,#7C5CFF 75%,#FF8A00);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:rise .7s .06s var(--spring) both,shine 6s linear infinite;padding-bottom:4px;margin-bottom:14px}
.bigname small{display:block;font-size:.2em;letter-spacing:.32em;text-transform:uppercase;-webkit-text-fill-color:var(--muted);color:var(--muted);margin-top:8px;font-family:Nunito;font-weight:900}
@keyframes shine{to{background-position:200% center}}
@media (max-width:520px){.bigname{white-space:normal}}
.hl{position:relative;color:var(--orange);white-space:nowrap}
.hl svg{position:absolute;left:-2%;bottom:-12px;width:104%;height:22px}
.hl svg path{stroke-dasharray:400;stroke-dashoffset:400;animation:draw 1.1s .7s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.hero p.lead{font-size:19px;font-weight:600;color:var(--muted);max-width:520px;line-height:1.55;animation:rise .7s .16s var(--spring) both}
@keyframes rise{from{opacity:0;transform:translateY(26px)}}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:32px;animation:rise .7s .24s var(--spring) both}
.mode-btn{text-align:left;padding:22px;border-radius:22px;border:2px solid var(--navy);box-shadow:var(--sh);transition:transform .2s var(--spring),box-shadow .2s;position:relative;overflow:hidden;color:#fff}
.mode-btn:hover{transform:translate(-3px,-3px) rotate(-.6deg);box-shadow:8px 8px 0 var(--navy)}
.mode-btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--navy)}
.mode-btn.p{background:linear-gradient(135deg,#FF8A2B,#FF5D8F)}
.mode-btn.u{background:linear-gradient(135deg,#19C79A,#3BA9FF)}
.mode-btn .mi{width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,.25);display:grid;place-items:center;margin-bottom:14px}
.mode-btn .mi svg{width:26px;height:26px;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.mode-btn h3{font-size:24px;margin-bottom:4px}
.mode-btn span{font-weight:700;font-size:14px;opacity:.92}
.mode-btn::after{content:"→";position:absolute;right:20px;top:18px;font-size:26px;font-weight:900;transition:transform .25s}
.mode-btn:hover::after{transform:translateX(5px)}
.quick{margin-top:22px;display:flex;align-items:center;gap:10px;font-weight:800;color:var(--muted);flex-wrap:wrap;animation:rise .7s .32s var(--spring) both}
.quick .input{width:170px;letter-spacing:.2em;font-size:16px;text-align:center}

.hero-vis{position:relative;height:520px}
.phone{position:absolute;left:12%;top:20px;width:270px;height:470px;background:#fff;border:3px solid var(--navy);border-radius:38px;box-shadow:10px 10px 0 var(--navy);padding:22px 18px;animation:float 6s ease-in-out infinite}
.phone::before{content:"";position:absolute;top:10px;left:50%;transform:translateX(-50%);width:70px;height:6px;border-radius:9px;background:#E6D9C8}
@keyframes float{50%{transform:translateY(-14px)}}
.phone .q{font-family:Fredoka;font-weight:600;font-size:19px;margin:14px 0 18px}
.phone .opt-demo{display:flex;align-items:center;gap:10px;padding:11px 12px;border:2px solid #EEE2D2;border-radius:13px;margin-bottom:10px;font-weight:800;font-size:14px}
.phone .opt-demo.sel{border-color:var(--orange);background:#FFF3E8;animation:pulseSel 3s infinite}
@keyframes pulseSel{0%,30%{border-color:#EEE2D2;background:#fff}40%,100%{border-color:var(--orange);background:#FFF3E8}}
.phone .opt-demo i{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;color:#fff;font-style:normal;font-size:11px}
.phone .send{margin-top:16px;width:100%;background:var(--navy);color:#fff;padding:12px;border-radius:13px;font-weight:900;text-align:center}
.screen{position:absolute;right:0;top:70px;width:300px;padding:20px;animation:float 7s 1s ease-in-out infinite}
.screen h4{font-size:16px;margin-bottom:14px}
.bars-demo{display:flex;align-items:flex-end;gap:12px;height:150px;border-bottom:2px solid var(--line)}
.bars-demo div{flex:1;border-radius:9px 9px 3px 3px;animation:barDance 4s ease-in-out infinite;transform-origin:bottom}
@keyframes barDance{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}
.bars-demo-l{display:flex;gap:12px;margin-top:6px;font-size:11px;font-weight:800;color:var(--muted)}.bars-demo-l span{flex:1;text-align:center}
.cloud-card{position:absolute;right:30px;bottom:30px;width:260px;padding:18px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;justify-content:center;animation:float 8s .5s ease-in-out infinite}
.cloud-card span{font-family:Fredoka;font-weight:600;animation:popIn .6s var(--spring) both}
.chip-live{position:absolute;left:0;top:250px;padding:10px 14px;display:flex;gap:10px;align-items:center;font-weight:900;animation:float 5s .3s ease-in-out infinite}
.dot-live{width:11px;height:11px;border-radius:50%;background:var(--pink);box-shadow:0 0 0 0 rgba(255,93,143,.6);animation:ping 1.6s infinite}
@keyframes ping{70%{box-shadow:0 0 0 12px rgba(255,93,143,0)}100%{box-shadow:0 0 0 0 rgba(255,93,143,0)}}
.emoji{position:absolute;font-size:28px;animation:emojiUp 5s linear infinite;opacity:0}
@keyframes emojiUp{0%{opacity:0;transform:translateY(0) scale(.6)}15%{opacity:1}100%{opacity:0;transform:translateY(-260px) scale(1.2) rotate(20deg)}}

.marquee{background:var(--navy);color:#fff;padding:16px 0;overflow:hidden;border-block:3px solid var(--navy);transform:rotate(-1.2deg);margin:0 -20px}
.marquee-in{display:flex;gap:46px;width:max-content;animation:marq 34s linear infinite}
.marquee-in span{display:flex;align-items:center;gap:12px;font-family:Fredoka;font-size:22px;font-weight:500}
.marquee-in .ticon{width:24px;height:24px}
@keyframes marq{to{transform:translateX(-50%)}}

section.sec{padding:100px 0}
.sec-head{text-align:center;max-width:680px;margin:0 auto 54px}
.eyebrow{display:inline-block;font-weight:900;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--orange);margin-bottom:12px}
.sec-head h2{font-size:clamp(34px,4.4vw,52px);margin-bottom:14px}
.sec-head p{font-size:18px;color:var(--muted);font-weight:600;line-height:1.55}
.types-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}
.type-card{padding:22px;transition:transform .25s var(--spring),box-shadow .25s;cursor:default}
.type-card:hover{transform:translate(-4px,-4px) rotate(-.8deg);box-shadow:9px 9px 0 var(--navy)}
.type-card .ti{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;margin-bottom:16px;border:2px solid var(--navy)}
.type-card .ti .ticon{width:30px;height:30px}
.type-card h4{font-size:21px;margin-bottom:6px}
.type-card p{color:var(--muted);font-weight:600;line-height:1.5;font-size:15px}
.reveal{opacity:0;transform:translateY(34px);transition:opacity .7s,transform .7s var(--spring)}
.reveal.in{opacity:1;transform:none}

.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;position:relative}
.step{padding:30px;position:relative}
.step .n{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-family:Fredoka;font-size:26px;font-weight:700;color:#fff;border:2px solid var(--navy);margin-bottom:18px;box-shadow:var(--sh-sm)}
.step h4{font-size:23px;margin-bottom:8px}
.step p{color:var(--muted);font-weight:600;line-height:1.55}
.feat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.feat{padding:26px;border-radius:22px;border:2px solid var(--navy)}
.feat .fi{font-size:34px;margin-bottom:14px}
.feat h4{font-size:20px;margin-bottom:6px}
.feat p{font-weight:600;line-height:1.5;opacity:.85}
.cta{margin:0 auto 100px;padding:56px;border-radius:32px;background:linear-gradient(120deg,var(--orange),var(--pink) 55%,var(--violet));color:#fff;border:3px solid var(--navy);box-shadow:10px 10px 0 var(--navy);display:flex;align-items:center;justify-content:space-between;gap:30px;flex-wrap:wrap;position:relative;overflow:hidden}
.cta h2{font-size:clamp(30px,4vw,46px);max-width:560px}
.cta::before{content:"";position:absolute;width:300px;height:300px;border-radius:50%;background:rgba(255,255,255,.12);right:-80px;top:-120px}

footer.foot{background:var(--navy);color:#C9CFEA;padding:70px 0 26px;border-top:4px solid var(--orange);position:relative;overflow:hidden}
.foot-grid{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:40px}
.foot p{line-height:1.6;font-weight:600;margin-top:16px;max-width:340px}
.foot h5{font-family:Fredoka;font-size:17px;color:#fff;font-weight:600;margin-bottom:16px}
.foot ul{list-style:none;display:flex;flex-direction:column;gap:10px;font-weight:700}
.foot ul a:hover{color:var(--amber)}
.foot-bottom{margin-top:50px;padding-top:22px;border-top:1px solid rgba(255,255,255,.12);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-weight:700;font-size:14px}
.foot-wave{position:absolute;right:-40px;bottom:-60px;width:320px;opacity:.08;pointer-events:none}
.mini-foot{text-align:center;padding:20px;font-weight:700;color:var(--muted);font-size:13px}
.mini-foot b{color:var(--orange)}
.mini-foot a:hover b{text-decoration:underline}

/* ---------- Presenter dashboard ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 24px;background:#fff;border-bottom:2px solid var(--line);position:sticky;top:0;z-index:40}
.dash{width:min(1180px,100% - 40px);margin:36px auto 60px}
.dash-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:28px;flex-wrap:wrap}
.dash-head h1{font-size:42px}
.pres-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:22px}
.pcard{overflow:hidden;display:flex;flex-direction:column;animation:rise .5s var(--spring) both;transition:transform .2s var(--spring),box-shadow .2s}
.pcard:hover{transform:translate(-3px,-3px);box-shadow:8px 8px 0 var(--navy)}
.pcard .cover{height:118px;position:relative;border-bottom:2px solid var(--navy);display:flex;align-items:flex-end;padding:14px;gap:6px}
.pcard .cover .ticon{width:34px;height:34px;color:#fff;filter:drop-shadow(2px 2px 0 rgba(27,37,89,.35))}
.pcard .code{position:absolute;top:12px;right:12px;background:#fff;border:2px solid var(--navy);border-radius:10px;padding:4px 10px;font-weight:900;letter-spacing:.08em;font-size:14px;cursor:pointer}
.pcard .body{padding:16px 18px 18px;flex:1;display:flex;flex-direction:column}
.pcard h3{font-size:21px;margin-bottom:4px;word-break:break-word}
.pcard .meta{color:var(--muted);font-weight:700;font-size:13px;margin-bottom:16px}
.pcard .acts{display:flex;gap:8px;margin-top:auto;flex-wrap:wrap}
.new-card{border:3px dashed #D8C8B4;border-radius:var(--r);display:grid;place-items:center;min-height:270px;font-family:Fredoka;font-size:20px;font-weight:600;color:var(--muted);transition:all .25s;text-align:center;gap:10px}
.new-card:hover{border-color:var(--orange);color:var(--orange);background:#FFF3E8}
.new-card .plus{width:64px;height:64px;border-radius:20px;background:var(--orange);color:#fff;display:grid;place-items:center;font-size:36px;margin:0 auto 10px;border:2px solid var(--navy);box-shadow:var(--sh-sm);transition:transform .3s var(--spring)}
.new-card:hover .plus{transform:rotate(90deg) scale(1.08)}
.empty-dash{text-align:center;padding:40px;color:var(--muted);font-weight:700}

/* ---------- Login ---------- */
.lock-ico{width:72px;height:72px;border-radius:22px;background:linear-gradient(135deg,var(--orange),var(--pink));display:grid;place-items:center;margin-bottom:18px;border:2px solid var(--navy);box-shadow:var(--sh-sm)}
.lock-ico svg{width:34px;height:34px;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round}
.pw-wrap{position:relative}
.pw-wrap button{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-weight:900;font-size:12px;color:var(--muted);padding:6px}

/* ---------- Editor ---------- */
.ed{display:grid;grid-template-columns:250px 1fr 340px;grid-template-rows:auto 1fr;height:100vh}
.ed-top{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:12px 18px;background:#fff;border-bottom:2px solid var(--line)}
.ed-top .title-in{flex:1;max-width:460px;font-family:Fredoka;font-size:20px;font-weight:600;border:2px solid transparent;background:transparent;padding:8px 12px;border-radius:12px;outline:none}
.ed-top .title-in:hover{background:var(--soft)}
.ed-top .title-in:focus{border-color:var(--orange);background:#fff}
.save-state{font-size:13px;font-weight:800;color:var(--muted);display:flex;align-items:center;gap:6px}
.save-state i{width:8px;height:8px;border-radius:50%;background:var(--mint)}
.save-state.dirty i{background:var(--amber)}
.ed-side{background:#fff;border-right:2px solid var(--line);overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.thumb{position:relative;display:flex;gap:10px;padding:10px;border:2px solid var(--line);border-radius:14px;cursor:pointer;transition:all .2s;background:#fff;animation:rise .35s var(--spring) both}
.thumb:hover{border-color:#D8C8B4}
.thumb.sel{border-color:var(--navy);box-shadow:var(--sh-sm);background:#FFFBF6}
.thumb .num{font-weight:900;font-size:12px;color:var(--muted);width:16px}
.thumb .tc{flex:1;min-width:0}
.thumb .tc .ticon{width:22px;height:22px}
.thumb .tt{font-size:13px;font-weight:800;line-height:1.3;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.thumb .tools{position:absolute;right:6px;top:6px;display:none;gap:2px;background:#fff;border-radius:9px;padding:2px;border:1.5px solid var(--line)}
.thumb:hover .tools,.thumb.sel .tools{display:flex}
.thumb .tools button{width:24px;height:24px;border-radius:7px;font-size:13px;font-weight:900;display:grid;place-items:center}
.thumb .tools button:hover{background:var(--soft)}
.add-slide{border:2.5px dashed #D8C8B4;border-radius:14px;padding:14px;font-weight:900;color:var(--muted);transition:all .2s}
.add-slide:hover{border-color:var(--orange);color:var(--orange);background:#FFF3E8}
.ed-main{overflow:auto;padding:28px;display:flex;flex-direction:column;gap:12px;background:radial-gradient(#E9DCCB 1.2px,transparent 1.2px) 0 0/22px 22px,var(--bg)}
.canvas-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.canvas{flex:1;min-height:440px;padding:34px;display:flex;flex-direction:column}
.ed-panel{background:#fff;border-left:2px solid var(--line);overflow:auto;padding:20px}
.ed-panel h4{font-size:18px;margin-bottom:16px;display:flex;align-items:center;gap:10px}
.list-row{display:flex;gap:6px;align-items:center;margin-bottom:8px;animation:rise .3s var(--spring) both}
.list-row .bullet{width:12px;height:12px;border-radius:4px;flex:none}
.list-row .input{padding:9px 12px;font-size:14px}
.list-row .x{width:32px;height:32px;border-radius:10px;font-weight:900;color:var(--muted);flex:none}
.list-row .x:hover{background:#FFE8EE;color:var(--pink)}
.add-link{font-weight:900;color:var(--orange);font-size:14px;padding:6px 0;margin-bottom:14px}
.hint{font-size:13px;color:var(--muted);font-weight:600;line-height:1.5;background:var(--soft);padding:12px;border-radius:12px;margin-bottom:14px}
.imgprev{width:100%;border-radius:12px;border:2px solid var(--line);margin-bottom:10px;max-height:160px;object-fit:cover}
.type-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.type-pick button{display:flex;align-items:center;gap:12px;padding:14px;border:2px solid var(--line);border-radius:16px;text-align:left;font-weight:800;font-size:16px;transition:all .2s var(--spring);background:#fff}
.type-pick button:hover{border-color:var(--navy);transform:translate(-2px,-2px);box-shadow:var(--sh-sm)}
.type-pick small{display:block;font-weight:600;color:var(--muted);font-size:12.5px;margin-top:2px}

/* ---------- Slide stage (shared presenter/editor) ---------- */
.q-chip{display:inline-flex;align-items:center;gap:8px;font-weight:900;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.q-chip .ticon{width:20px;height:20px}
.q-title{font-size:clamp(26px,3.4vw,46px);margin:10px 0 26px;word-break:break-word}
.res{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:240px;position:relative}
.empty-res{text-align:center;color:var(--muted);font-weight:800;font-size:18px;padding:30px}
.empty-res .bounce{font-size:44px;display:block;margin-bottom:10px;animation:bob 1.8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px)}}
.pop{animation:popIn .55s var(--spring) both}
@keyframes popIn{from{opacity:0;transform:scale(.4)}}
.grow-y{animation:growY .9s var(--spring) both;transform-origin:bottom}
@keyframes growY{from{transform:scaleY(0)}}
.grow-x{animation:growX .9s var(--spring) both;transform-origin:left}
@keyframes growX{from{transform:scaleX(0)}}
.seen{animation:none!important}

/* MC */
.mc-res{display:flex;gap:clamp(10px,2vw,28px);align-items:flex-end;height:min(46vh,380px);padding:0 10px}
.mc-col{flex:1;display:flex;flex-direction:column;height:100%;min-width:0}
.mc-val{text-align:center;margin-bottom:8px;display:flex;flex-direction:column}
.mc-val b{font-family:Fredoka;font-size:clamp(22px,2.6vw,34px);font-weight:600}
.mc-val span{font-weight:900;color:var(--muted);font-size:14px}
.mc-track{flex:1;display:flex;align-items:flex-end;border-bottom:3px solid var(--navy)}
.mc-fill{width:100%;border-radius:14px 14px 4px 4px;border:2px solid var(--navy);border-bottom:none;transition:height .8s var(--spring)}
.mc-lab{text-align:center;font-weight:800;margin-top:10px;font-size:clamp(13px,1.3vw,17px);word-break:break-word}
/* Word cloud */
.wc{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px 22px;padding:10px;max-width:1000px;margin:0 auto}
.wc-w{font-family:Fredoka;font-weight:600;line-height:1.05;transition:font-size .6s var(--spring);display:inline-block;position:relative}
.wc-w.top{text-shadow:3px 3px 0 rgba(27,37,89,.15)}
.wc-n{font-family:Nunito;font-weight:900;font-size:max(14px,.24em);vertical-align:super;margin-left:4px;padding:2px 9px;border-radius:99px;background:currentColor;line-height:1.3;display:inline-block;border:2px solid var(--navy)}
.wc-n b{color:#fff;font-weight:900}
/* Open ended */
.oe{columns:3 240px;column-gap:16px;max-height:52vh;overflow:auto;padding:6px}
.oe-card{break-inside:avoid;margin-bottom:16px;padding:16px 18px;border-radius:18px;background:#fff;border:2px solid var(--navy);box-shadow:4px 4px 0 var(--c);font-weight:700;font-size:16.5px;line-height:1.45;word-break:break-word}
/* Scales / points rows */
.sc-row{display:grid;grid-template-columns:minmax(120px,26%) 1fr 64px;gap:18px;align-items:center;margin-bottom:22px}
.sc-lab{font-weight:800;font-size:17px;word-break:break-word}
.sc-track{position:relative;height:16px;border-radius:99px;background:#F1E7DA}
.sc-fill{position:absolute;inset:0 auto 0 0;border-radius:99px;opacity:.35;transition:width .8s var(--spring)}
.sc-dot{position:absolute;top:50%;width:30px;height:30px;border-radius:50%;border:3px solid var(--navy);transform:translate(-50%,-50%);transition:left .8s var(--spring),opacity .3s;box-shadow:2px 2px 0 var(--navy)}
.sc-avg{font-family:Fredoka;font-size:26px;font-weight:600;text-align:right}
.sc-ends{display:grid;grid-template-columns:minmax(120px,26%) 1fr 64px;gap:18px;font-weight:800;color:var(--muted);font-size:13px;margin-top:-6px}
.sc-ends div:nth-child(2){display:flex;justify-content:space-between}
.pt-bar{height:34px;border-radius:10px;border:2px solid var(--navy);transition:width .8s var(--spring);min-width:4px}
/* Ranking */
.rk{position:relative}
.rk-row{position:absolute;left:0;right:0;height:58px;display:grid;grid-template-columns:44px minmax(110px,28%) 1fr;gap:14px;align-items:center;transition:top .8s var(--spring)}
.rk-n{width:40px;height:40px;border-radius:12px;background:var(--navy);color:#fff;display:grid;place-items:center;font-family:Fredoka;font-weight:600;font-size:20px}
.rk-lab{font-weight:800;font-size:17px;word-break:break-word}
.rk-bar{height:30px;border-radius:9px;border:2px solid var(--navy);transition:width .8s var(--spring);min-width:4px}
/* Q&A */
.qa-list{display:flex;flex-direction:column;gap:12px;max-height:52vh;overflow:auto;padding:4px}
.qa-item{display:flex;gap:16px;align-items:center;padding:14px 16px;border:2px solid var(--navy);border-radius:18px;background:#fff;box-shadow:3px 3px 0 var(--navy)}
.qa-item.done{opacity:.5;box-shadow:none}
.qa-up{min-width:58px;text-align:center;border-radius:14px;background:#FFE8EE;padding:6px;display:flex;flex-direction:column}
.qa-up b{font-family:Fredoka;font-size:24px;font-weight:600;color:var(--pink)}
.qa-up small{font-weight:900;font-size:10.5px;color:var(--muted);text-transform:uppercase}
.qa-text{flex:1;font-weight:700;font-size:17px;word-break:break-word}
/* Guess */
.gs{position:relative;padding:40px 10px 0}
.gs-bars{display:flex;align-items:flex-end;gap:4px;height:min(36vh,280px);border-bottom:3px solid var(--navy)}
.gs-bar{flex:1;border-radius:7px 7px 2px 2px;background:linear-gradient(var(--amber),var(--orange));transition:height .8s var(--spring);border:2px solid var(--navy);border-bottom:none}
.gs-bar.z{border:none;background:#F1E7DA}
.gs-axis{display:flex;justify-content:space-between;font-weight:900;color:var(--muted);margin-top:8px}
.gs-mark{position:absolute;top:0;bottom:30px;width:0;border-left:3px dashed var(--navy);transition:left .8s var(--spring)}
.gs-mark span{position:absolute;top:0;left:50%;transform:translateX(-50%);white-space:nowrap;background:var(--navy);color:#fff;font-weight:900;font-size:13px;padding:4px 10px;border-radius:9px}
.gs-mark.ok{border-color:var(--mint)}.gs-mark.ok span{background:var(--mint)}
.gs-stats{display:flex;gap:26px;justify-content:center;margin-top:18px;font-weight:800;color:var(--muted)}
.gs-stats b{color:var(--ink);font-family:Fredoka;font-size:24px;font-weight:600;margin-left:6px}
/* 2x2 grid */
.gr-wrap{display:flex;gap:28px;align-items:center;justify-content:center;flex-wrap:wrap}
.gr-box{position:relative;width:min(46vh,400px);aspect-ratio:1;border:3px solid var(--navy);border-radius:16px;background:
 linear-gradient(var(--navy),var(--navy)) center/2px 100% no-repeat,linear-gradient(var(--navy),var(--navy)) center/100% 2px no-repeat,
 linear-gradient(135deg,#FFF3E8 0 50%,#EAF6FF 50%);margin:10px 30px 34px 40px}
.gr-q{position:absolute;font-weight:900;font-size:11px;color:var(--muted);opacity:.7}
.gr-xl,.gr-yl{position:absolute;font-weight:900;font-size:13px;white-space:nowrap}
.gr-xl{bottom:-30px;left:50%;transform:translateX(-50%)}
.gr-yl{left:-34px;top:50%;transform:translate(-50%,-50%) rotate(-90deg)}
.gr-pt{position:absolute;width:9px;height:9px;border-radius:50%;transform:translate(-50%,50%);opacity:.35}
.gr-avg{position:absolute;width:26px;height:26px;border-radius:50%;background:var(--c);border:3px solid var(--navy);transform:translate(-50%,50%);transition:left .8s var(--spring),bottom .8s var(--spring),opacity .3s;box-shadow:2px 2px 0 var(--navy);z-index:2}
.gr-avg span{position:absolute;left:30px;top:50%;transform:translateY(-50%);white-space:nowrap;font-weight:900;font-size:13px;background:#fff;padding:2px 8px;border-radius:8px;border:2px solid var(--navy)}
.gr-legend{display:flex;flex-direction:column;gap:8px;font-weight:800}
.gr-legend i{display:inline-block;width:14px;height:14px;border-radius:50%;margin-right:8px;border:2px solid var(--navy);vertical-align:-2px}
/* Form */
.fm-count{font-family:Fredoka;font-size:20px;font-weight:600;margin-bottom:14px}
.fm-table{width:100%;border-collapse:separate;border-spacing:0;border:2px solid var(--navy);border-radius:14px;overflow:hidden;background:#fff}
.fm-table th{background:var(--navy);color:#fff;text-align:left;padding:11px 14px;font-size:13px;letter-spacing:.04em}
.fm-table td{padding:10px 14px;border-top:1.5px solid var(--line);font-weight:700;font-size:14.5px;word-break:break-word}
.fm-scroll{max-height:48vh;overflow:auto}
/* Pin */
.pin-wrap{position:relative;display:inline-block;max-width:100%;margin:0 auto;border:3px solid var(--navy);border-radius:16px;overflow:hidden;box-shadow:var(--sh)}
.pin-wrap img{display:block;max-width:100%;max-height:50vh;user-select:none;-webkit-user-drag:none}
.pin-dot{position:absolute;width:20px;height:20px;border-radius:50% 50% 50% 0;background:var(--violet);border:2.5px solid #fff;transform:translate(-50%,-100%) rotate(-45deg);box-shadow:0 3px 8px rgba(27,37,89,.4)}
.pin-dot.pop{animation:pinDrop .5s var(--spring) both}
@keyframes pinDrop{from{opacity:0;transform:translate(-50%,-260%) rotate(-45deg)}}

/* ---------- Present view ---------- */
.pv{min-height:100vh;display:flex;flex-direction:column;background:var(--bg)}
.pv-top{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:14px 26px;background:#fff;border-bottom:2px solid var(--line);flex-wrap:wrap}
.join-banner{display:flex;align-items:center;gap:14px;font-weight:800;font-size:16px}
.join-banner .codebig{font-family:Fredoka;font-weight:700;font-size:30px;letter-spacing:.06em;background:var(--yellow);padding:2px 14px;border-radius:12px;border:2px solid var(--navy);box-shadow:var(--sh-sm)}
.qr{width:74px;height:74px;padding:4px;background:#fff;border:2px solid var(--navy);border-radius:10px;cursor:zoom-in;transition:transform .25s var(--spring),box-shadow .25s}
.qr:hover{transform:scale(1.08) rotate(-2deg);box-shadow:var(--sh-sm)}
.join-banner .codebig{cursor:zoom-in}
.qr-modal{text-align:center}
.qr-modal .qr-big{width:min(62vh,78vw,460px);aspect-ratio:1;margin:18px auto;padding:14px;background:#fff;border:3px solid var(--navy);border-radius:22px;box-shadow:var(--sh);display:grid;place-items:center;animation:popIn .5s var(--spring)}
.qr-modal .qr-big img,.qr-modal .qr-big canvas{width:100%!important;height:100%!important;image-rendering:pixelated}
.qr-modal .code-xl{font-family:Fredoka;font-weight:700;font-size:clamp(44px,7vw,72px);letter-spacing:.08em;background:var(--yellow);display:inline-block;padding:2px 22px;border-radius:18px;border:3px solid var(--navy);box-shadow:var(--sh-sm);margin:6px 0 12px}
.qr-modal .url{font-weight:800;color:var(--muted);word-break:break-all;font-size:14px}
.qr img,.qr canvas{width:100%!important;height:100%!important}
.pv-stage{flex:1;display:flex;flex-direction:column;padding:34px clamp(20px,5vw,80px) 20px;width:100%;max-width:1400px;margin:0 auto}
.pv-stage .stage-anim{animation:rise .55s var(--spring) both;display:flex;flex-direction:column;flex:1}
.pv-bar{display:flex;align-items:center;justify-content:center;gap:10px;padding:14px;flex-wrap:wrap}
.pv-bar .group{display:flex;gap:6px;background:#fff;padding:6px;border:2px solid var(--navy);border-radius:16px;box-shadow:var(--sh-sm)}
.pv-count{display:flex;align-items:center;gap:8px;font-weight:900}
.pv-count b{font-family:Fredoka;font-size:22px}
.hidden-res{text-align:center;padding:50px;font-family:Fredoka;font-size:26px;color:var(--muted)}
.hidden-res b{display:block;font-size:64px;color:var(--orange)}

/* ---------- Audience ---------- */
.aud{min-height:100vh;display:flex;flex-direction:column;background:linear-gradient(180deg,#FFF3E6,var(--bg) 40%)}
.aud-top{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;gap:10px}
.aud-left{display:flex;align-items:center;gap:12px;min-width:0}
.home-btn{padding:7px 12px;gap:6px;background:#fff}
.home-btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:520px){.aud-top{padding:12px 14px}.aud-left{gap:8px}.home-btn{padding:6px 10px;font-size:12.5px}.aud-top .tag{font-size:11px;padding:4px 9px}}
@media (max-width:420px){.aud-top .tag b{display:none}}
@media (max-width:370px){.aud-top .brand-logo{height:31px}.home-btn span{display:none}.home-btn{padding:7px}}
.aud-main{flex:1;width:min(560px,100% - 28px);margin:6px auto 20px}
.aud-card{padding:26px 22px;animation:rise .5s var(--spring) both}
.aud-card .q-title{font-size:clamp(24px,6vw,32px);margin:8px 0 22px}
.join-card{width:min(460px,100% - 28px);margin:7vh auto 20px;padding:34px 28px;text-align:center;animation:rise .6s var(--spring) both}
.join-card h1{font-size:36px;margin:16px 0 8px}
.code-in{font-family:Fredoka;font-size:38px;font-weight:600;letter-spacing:.3em;text-align:center;padding:14px;border:3px solid var(--navy);border-radius:18px;width:100%;outline:none;box-shadow:var(--sh-sm);margin:22px 0 16px;background:#fff}
.code-in:focus{background:#FFFBEA}
.anon{display:inline-flex;align-items:center;gap:8px;margin-top:18px;font-weight:800;font-size:13.5px;color:var(--muted)}
.opt{display:flex;align-items:center;gap:12px;width:100%;padding:15px 16px;border:2.5px solid #EADDCB;border-radius:16px;margin-bottom:11px;font-weight:800;font-size:16.5px;text-align:left;background:#fff;transition:all .2s var(--spring)}
.opt:hover{border-color:#D3C1AA}
.opt .lt{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:900;flex:none;font-size:14px;transition:transform .25s var(--spring)}
.opt.sel{border-color:var(--navy);background:#FFF6EC;box-shadow:var(--sh-sm);transform:translate(-2px,-2px)}
.opt.sel .lt{transform:scale(1.15) rotate(-8deg)}
.submit{width:100%;margin-top:10px;padding:16px;font-size:17px}
.range{width:100%;accent-color:var(--orange);height:28px}
.rng-row{margin-bottom:22px}
.rng-head{display:flex;justify-content:space-between;align-items:center;font-weight:800;margin-bottom:6px;gap:10px}
.rng-head b{font-family:Fredoka;font-size:22px;color:var(--orange);min-width:34px;text-align:right}
.rng-ends{display:flex;justify-content:space-between;font-size:12.5px;font-weight:800;color:var(--muted)}
.rk-item{display:flex;align-items:center;gap:10px;padding:12px 12px;border:2.5px solid var(--navy);border-radius:15px;margin-bottom:9px;background:#fff;font-weight:800;box-shadow:2px 2px 0 var(--navy);transition:transform .25s var(--spring)}
.rk-item .n{width:28px;height:28px;border-radius:9px;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:13px;flex:none}
.rk-item span{flex:1;word-break:break-word}
.rk-item button{width:34px;height:34px;border-radius:10px;background:var(--soft);font-weight:900;font-size:14px}
.rk-item button:disabled{opacity:.3}
.budget{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-radius:14px;background:var(--navy);color:#fff;font-weight:800;margin-bottom:18px;position:sticky;top:8px;z-index:2}
.budget b{font-family:Fredoka;font-size:26px;color:var(--yellow)}
.grid-item{padding:14px;border:2px solid var(--line);border-radius:16px;margin-bottom:12px}
.grid-item h5{font-size:17px;font-family:Fredoka;font-weight:600;margin-bottom:10px}
.big-num{font-family:Fredoka;font-size:64px;font-weight:700;text-align:center;color:var(--orange);line-height:1;margin:6px 0 14px}
.stepper{display:flex;gap:10px;align-items:center}
.stepper button{width:44px;height:44px;border-radius:13px;border:2px solid var(--navy);font-size:22px;font-weight:900;background:#fff;box-shadow:2px 2px 0 var(--navy);flex:none}
.pin-pick{cursor:crosshair}
.thanks{text-align:center;padding:36px 16px}
.check{width:96px;height:96px;margin:0 auto 18px;border-radius:50%;background:var(--mint);display:grid;place-items:center;border:3px solid var(--navy);box-shadow:var(--sh);animation:popIn .6s var(--spring)}
.check svg{width:48px;height:48px;fill:none;stroke:#fff;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:draw .6s .3s forwards}
.thanks h2{font-size:30px;margin-bottom:8px}
.thanks p{color:var(--muted);font-weight:700}
.dots i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--orange);margin:0 3px;animation:bob 1.2s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
.waiting{text-align:center;padding:50px 18px}
.waiting .orb{width:110px;height:110px;margin:0 auto 22px;border-radius:50%;background:conic-gradient(var(--orange),var(--pink),var(--violet),var(--sky),var(--mint),var(--orange));animation:spin 3s linear infinite;display:grid;place-items:center;border:3px solid var(--navy)}
.waiting .orb::after{content:"";width:74px;height:74px;border-radius:50%;background:var(--bg);border:3px solid var(--navy)}
@keyframes spin{to{transform:rotate(360deg)}}
.progress{display:flex;gap:5px;justify-content:center;margin-bottom:6px}
.progress i{width:22px;height:6px;border-radius:9px;background:#EADDCB;transition:all .3s}
.progress i.on{background:var(--orange);width:34px}
.qa-mine{display:flex;gap:8px;margin-bottom:16px}
.upv{display:flex;flex-direction:column;align-items:center;min-width:52px;padding:6px;border-radius:12px;border:2px solid #EADDCB;font-weight:900;transition:all .2s var(--spring)}
.upv.on{background:var(--pink);color:#fff;border-color:var(--navy);transform:scale(1.06)}
.upv span{font-size:16px;line-height:1}
.locked-note{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:14px;background:#FFE8EE;font-weight:800;margin-bottom:14px}
.loader{display:grid;place-items:center;min-height:60vh}

/* ---------- Welcome slide ---------- */
.wel{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative;padding:10px 0 20px}
.wel-logo{height:clamp(70px,11vh,120px);width:auto;animation:popIn .7s var(--spring) both}
.wel-hi{font-family:Fredoka;font-weight:600;font-size:clamp(20px,2.4vw,30px);color:var(--muted);margin-top:26px;animation:rise .6s .15s var(--spring) both}
.wel-app{font-family:Fredoka;font-weight:700;font-size:clamp(48px,7vw,104px);line-height:1;letter-spacing:-.02em;margin:6px 0 4px;padding-bottom:6px;
  background:linear-gradient(90deg,#FF8A00,#FF5D8F 45%,#7C5CFF 75%,#FF8A00);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:rise .6s .25s var(--spring) both,shine 6s linear infinite}
.wel-by{font-weight:900;letter-spacing:.24em;text-transform:uppercase;font-size:clamp(11px,1.1vw,14px);color:var(--orange);animation:rise .6s .32s var(--spring) both}
.wel-title{margin-top:30px;display:inline-block;max-width:min(900px,100%);padding:14px 30px;border-radius:20px;background:#fff;border:3px solid var(--navy);box-shadow:var(--sh);font-family:Fredoka;font-weight:600;font-size:clamp(24px,3.2vw,42px);word-break:break-word;animation:rise .6s .4s var(--spring) both}
.wel-title small{display:block;font-family:Nunito;font-weight:900;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.wel-join{margin-top:30px;display:flex;align-items:center;gap:22px;flex-wrap:wrap;justify-content:center;animation:rise .6s .5s var(--spring) both}
.wel-join .txt{font-weight:800;font-size:18px;text-align:left;line-height:1.5}
.wel-join .codebig{font-family:Fredoka;font-weight:700;font-size:clamp(34px,4vw,52px);letter-spacing:.06em;background:var(--yellow);padding:2px 18px;border-radius:14px;border:3px solid var(--navy);box-shadow:var(--sh-sm);cursor:zoom-in}
.wel-qr{width:140px;height:140px;padding:6px;background:#fff;border:3px solid var(--navy);border-radius:14px;box-shadow:var(--sh-sm);cursor:zoom-in}
.wel-qr img,.wel-qr canvas{width:100%!important;height:100%!important}
.wel-emo{position:absolute;font-size:34px;animation:float 6s ease-in-out infinite;opacity:.9}
.wel-card{text-align:center;padding:34px 22px}
.wel-card .wel-logo{height:64px}
.wel-card .wel-app{font-size:clamp(38px,11vw,54px)}
.wel-card .wel-title{font-size:22px;padding:12px 18px;margin-top:22px}
.wel-wait{margin-top:32px;font-family:Fredoka;font-weight:600;font-size:clamp(20px,2.6vw,32px);color:var(--navy);display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;animation:rise .6s .5s var(--spring) both}
.wel-card .wel-wait{font-size:19px;margin-top:22px}
.canvas .wel-app,.wel-app{white-space:nowrap}
.canvas .wel-app{font-size:clamp(36px,4.6vw,72px)}
.canvas .wel-logo{height:clamp(56px,8vh,96px)}
.canvas .wel-title{font-size:clamp(20px,2.2vw,32px)}
.wel-card .wel-app{font-size:clamp(34px,10.5vw,54px)}
.thumb[data-i]{cursor:grab}
.thumb[data-i]:active{cursor:grabbing}
.thumb .grip{position:absolute;left:3px;top:50%;transform:translateY(-50%);font-size:13px;color:#C9B9A4;line-height:1;letter-spacing:-2px}
.thumb.dragging{opacity:.35}
.thumb.drop-before{box-shadow:0 -4px 0 var(--orange)}
.thumb.drop-after{box-shadow:0 4px 0 var(--orange)}
@media (max-width:1000px){.thumb.drop-before{box-shadow:-4px 0 0 var(--orange)}.thumb.drop-after{box-shadow:4px 0 0 var(--orange)}}
.thumb.wel-thumb{cursor:default;background:linear-gradient(135deg,#FFF3E8,#F3EEFF);border-style:dashed}
.thumb.wel-thumb .tt{color:var(--ink)}
.thumb.wel-thumb small{display:block;font-size:11px;font-weight:800;color:var(--muted);margin-top:2px}

/* ---------- Fastest Fingers First ---------- */
.ff-board{display:flex;flex-direction:column;gap:10px;max-height:52vh;overflow:auto;padding:4px 8px 8px 4px}
.ff-row{display:grid;grid-template-columns:52px minmax(100px,1fr) 1.4fr 84px 36px;gap:14px;align-items:center;padding:12px 16px;border:2px solid var(--navy);border-radius:16px;background:#fff;box-shadow:3px 3px 0 var(--navy)}
.ff-row.win{background:linear-gradient(90deg,#FFF0B8,#fff 70%);box-shadow:5px 5px 0 var(--amber)}
.ff-row.no{opacity:.62}
.ff-row.me{outline:3px solid var(--orange);outline-offset:2px}
.ff-rank{width:44px;height:44px;border-radius:13px;background:var(--navy);color:#fff;display:grid;place-items:center;font-family:Fredoka;font-weight:600;font-size:20px}
.ff-rank.m{background:none;font-size:32px}
.ff-name{font-weight:900;font-size:17px;word-break:break-word}
.ff-ans{font-weight:700;color:var(--muted);word-break:break-word}
.ff-time{font-family:Fredoka;font-weight:600;font-size:20px;text-align:right;white-space:nowrap}
.ff-mark{font-weight:900;font-size:20px;text-align:center}
.ff-mark.ok{color:var(--mint)}.ff-mark.bad{color:var(--pink)}
.ff-big{font-family:Fredoka;font-size:clamp(84px,13vw,170px);font-weight:700;text-align:center;line-height:1;color:var(--orange)}
.ff-big.low{color:var(--pink);animation:ffPulse 1s infinite}
@keyframes ffPulse{50%{transform:scale(1.07)}}
.ff-track{height:18px;border-radius:99px;background:#F1E7DA;border:2px solid var(--navy);overflow:hidden;width:min(700px,100%);margin:16px auto}
.ff-fill{height:100%;background:linear-gradient(90deg,var(--pink),var(--amber),var(--mint));transition:width .2s linear}
.ff-sub{text-align:center;font-weight:800;color:var(--muted);font-size:18px}
.ff-sub b{color:var(--ink);font-family:Fredoka;font-size:24px}
.ff-opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:22px}
.ff-opt{padding:14px 16px;border:2px solid var(--navy);border-radius:16px;background:#fff;font-weight:800;font-size:18px;display:flex;gap:10px;align-items:center;box-shadow:var(--sh-sm)}
.ff-opt.ok{background:#DBF8EE}
.ff-opt i{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;color:#fff;font-style:normal;font-size:14px;font-weight:900;flex:none}
.ff-state{text-align:center;padding:30px 10px}
.ff-state .em{font-size:72px;display:block;margin-bottom:8px;animation:bob 1.8s ease-in-out infinite}
.ff-state h2{font-size:clamp(30px,4vw,48px);margin-bottom:8px}
.ff-state p{color:var(--muted);font-weight:700;font-size:17px}
.ff-correct{display:inline-flex;gap:8px;align-items:center;padding:8px 14px;border-radius:12px;background:#DBF8EE;border:2px solid var(--navy);font-weight:900;margin-bottom:14px}
.ff-clock{display:flex;align-items:center;gap:12px;margin:-8px 0 18px}
.ff-clock .ff-track{margin:0;flex:1;height:14px}
.ff-clock b{font-family:Fredoka;font-size:28px;font-weight:700;color:var(--orange);min-width:58px;text-align:right}
.ff-clock b.low{color:var(--pink)}
.ff-me{text-align:center;padding:18px;border-radius:18px;background:var(--soft);border:2px dashed #E6D2B8;margin-bottom:16px}
.ff-me b{display:block;font-family:Fredoka;font-size:44px;color:var(--orange);line-height:1.1}
.ff-chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:22px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:12px;border:2px solid var(--navy);background:#fff;font-weight:800;font-size:16px;box-shadow:2px 2px 0 var(--navy);transition:transform .15s var(--spring),background .15s;text-align:left;word-break:break-word}
.chip:hover{transform:translate(-1px,-1px)}
.chip.big{font-size:clamp(17px,1.8vw,24px);padding:12px 18px;border-radius:14px;box-shadow:var(--sh-sm)}
.chip i{font-style:normal;width:22px;height:22px;border-radius:7px;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:12px;flex:none}
.chip.placed{background:var(--yellow)}
.ord-lbl{font-size:11.5px;font-weight:900;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:6px}
.ord-ans{min-height:62px;border:2.5px dashed #E1CDB3;border-radius:16px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px;background:#FFFBF6}
.ord-ans.steps{flex-direction:column;align-items:stretch}
.ord-ans:empty::before{content:attr(data-ph);color:var(--muted);font-weight:800;font-size:14px;padding:4px}
.ord-bank{display:flex;flex-wrap:wrap;gap:8px;min-height:46px;margin-bottom:6px}
.ord-tools{display:flex;justify-content:flex-end;margin-bottom:4px}
.bzr{display:block;width:min(270px,74vw);margin:6px auto 0;padding:0;border:none;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none;touch-action:manipulation;outline:none}
.bzr svg{width:100%;height:auto;display:block;overflow:visible}
.bzr .dome{transition:transform .07s ease-out;transform-box:view-box}
.bzr .ring-glow{transition:opacity .15s;animation:bzrPulse 1.6s ease-in-out infinite}
.bzr .ring{transition:fill .1s}
.bzr:hover .dome{transform:translateY(2px)}
.bzr:active .dome,.bzr.hit .dome{transform:translateY(11px)}
.bzr.hit .ring-glow,.bzr.on .ring-glow{animation:none;opacity:1}
.bzr.hit .ring,.bzr.on .ring{fill:url(#bzRingHot)}
.bzr.hit .glow-c1,.bzr.on .glow-c1{stop-color:#FFE27A}.bzr.hit .glow-c2,.bzr.on .glow-c2{stop-color:#FF7A1A}
.bzr:focus-visible{filter:drop-shadow(0 0 0 3px var(--orange))}
.bzr:disabled{pointer-events:none}
.bzr.small{width:min(150px,42vw)}
@keyframes bzrPulse{0%,100%{opacity:.55}50%{opacity:1}}
.bzr-hint{text-align:center;font-weight:900;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:4px 0 6px}
.bz-top{display:flex;align-items:center;gap:16px;width:min(760px,100%);margin:0 auto 18px}
.bz-top .ff-track{margin:0;flex:1}
.bz-top b{font-family:Fredoka;font-size:40px;font-weight:700;color:var(--orange);min-width:76px;text-align:right}
.bz-top b.low{color:var(--pink)}
.bz-pos{font-family:Fredoka;font-size:64px;font-weight:700;color:var(--pink);line-height:1;margin:6px 0}
.who{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:13px;color:var(--muted);margin-bottom:10px}
.who button{color:var(--orange);font-weight:900;text-decoration:underline}
.spinner{width:46px;height:46px;border-radius:50%;border:5px solid #F1E2CF;border-top-color:var(--orange);animation:spin .8s linear infinite}

/* ---------- Responsive ---------- */
@media (max-width:1000px){
  .hero .wrap{grid-template-columns:1fr}.hero-vis{height:480px;max-width:560px;margin:0 auto;width:100%}
  .feat-grid{grid-template-columns:1fr 1fr}.foot-grid{grid-template-columns:1fr 1fr}

  .thumb{min-width:180px}.add-slide{min-width:130px}

}

  .ff-ans{grid-row:2;grid-column:2/-1;font-size:14px}
  .ff-rank{width:36px;height:36px;font-size:16px}.ff-rank.m{font-size:26px}
  .ff-time{font-size:17px}
  .nav-links a{display:none}.modes{grid-template-columns:1fr}.steps{grid-template-columns:1fr}
  .feat-grid{grid-template-columns:1fr}.foot-grid{grid-template-columns:1fr}
  .phone{left:0;transform:scale(.9)}.screen{width:240px}.cloud-card{width:210px;right:0}
  section.sec{padding:70px 0}.cta{padding:34px}
  .ed-top{flex-wrap:wrap}.canvas{padding:20px}
  .sc-row,.sc-ends{grid-template-columns:1fr 50px}.sc-row .sc-lab,.sc-ends div:first-child{grid-column:1/-1}

  .pv-top{padding:12px}.join-banner .codebig{font-size:22px}
}

function newSlide(type) {
  const s = { id: rid(8), type };
  switch (type) {
    case 'mc': return { ...s, question: 'Which topic should we explore next?', options: ['Robotics', 'IoT', 'Artificial Intelligence', 'Space Science'], multi: false };
    case 'wordcloud': return { ...s, question: 'Describe today\'s session in one word', maxWords: 3 };
    case 'open': return { ...s, question: 'What is one thing you learned today?', multi: false };
    case 'scales': return { ...s, question: 'How confident do you feel about…', statements: ['Coding', 'Electronics', 'Design Thinking'], min: 1, max: 5, minLabel: 'Not at all', maxLabel: 'Very confident' };
    case 'ranking': return { ...s, question: 'Rank these features for our robot', items: ['Speed', 'Accuracy', 'Battery life', 'Design'] };
    case 'qa': return { ...s, question: 'Ask me anything about today\'s session' };
    case 'guess': return { ...s, question: 'In which year was the first Arduino board released?', min: 1990, max: 2020, correct: 2005 };
    case 'points': return { ...s, question: 'Spend 100 points on what we should build next', items: ['Line follower', 'Smart dustbin', 'Weather station', 'Drone'], budget: 100 };
    case 'grid': return { ...s, question: 'Rate each project idea', items: ['Smart irrigation', 'Face-recognition gate', 'Gesture robot'], xLabel: 'Effort', yLabel: 'Impact', gmin: 0, gmax: 10 };
    case 'form': return { ...s, question: 'Quick workshop feedback', fields: [{ label: 'Your school', type: 'text', req: false }, { label: 'Favourite activity', type: 'text', req: true }, { label: 'Any suggestions?', type: 'textarea', req: false }] };
    case 'pin': return { ...s, question: 'Tap where you would like to explore first', image: PIN_PLACEHOLDER };
    case 'blank': return { ...s, question: '', message: 'Wait for the next question' };
    case 'fff': return { ...s, question: 'Which sensor measures distance using sound waves?', mode: 'mc', options: ['LDR', 'Ultrasonic sensor', 'IR sensor', 'Thermistor'], correct: 1, answer: '', items: ['Sensors', 'collect', 'data', 'from', 'the', 'environment'], arrange: 'sentence', timeLimit: 20 };
  }
}

/* =====================================================================
   5. DATA LAYER  — LocalStore (demo) and FirebaseStore (production)
   Both expose the same API so the UI never cares which one is active.
   ===================================================================== */
const LocalStore = (() => {
  const subs = new Set();
  const chan = 'BroadcastChannel' in window ? new BroadcastChannel('mentee-mentor') : null;
  const fire = k => subs.forEach(f => f(k));
  const emit = k => { fire(k); chan && chan.postMessage(k); };
  if (chan) chan.onmessage = e => fire(e.data);
  window.addEventListener('storage', e => e.key && fire(e.key));
  const PK = 'mm_presentations';
  const all = () => LS.getJSON(PK, {});
  const rk = c => 'mm_r_' + c;
  const on = (key, fn) => { const f = k => { if (k === key) fn(); }; subs.add(f); return () => subs.delete(f); };
  const patchResp = (code, id, fn) => { const arr = LS.getJSON(rk(code), []); const r = arr.find(x => x.id === id); if (!r) return; fn(r); LS.setJSON(rk(code), arr); emit(rk(code)); };
  return {
    mode: 'demo',
    async init() {},
    now() { return Date.now(); },
    ts() { return Date.now(); },
    async list() { return Object.values(all()).sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0)); },
    async get(code) { return all()[code] || null; },
    async save(p) { const a = all(); a[p.code] = { ...(a[p.code] || {}), ...clone(p), updatedAt: Date.now() }; LS.setJSON(PK, a); emit(PK); },
    async update(code, patch) { const a = all(); if (!a[code]) return; Object.assign(a[code], patch); LS.setJSON(PK, a); emit(PK); },
    async remove(code) { const a = all(); delete a[code]; LS.setJSON(PK, a); LS.del(rk(code)); emit(PK); },
    watch(code, cb) { const run = () => cb(all()[code] || null); run(); return on(PK, run); },
    async addResponse(code, slideId, data) { const arr = LS.getJSON(rk(code), []); arr.push({ id: rid(12), slideId, voter: voterId(), data, ts: Date.now(), up: [], answered: false }); LS.setJSON(rk(code), arr); emit(rk(code)); },
    watchResponses(code, slideId, cb) { const run = () => cb(LS.getJSON(rk(code), []).filter(r => r.slideId === slideId)); run(); return on(rk(code), run); },
    async toggleUpvote(code, id, vid) { patchResp(code, id, r => { r.up = r.up || []; const i = r.up.indexOf(vid); i >= 0 ? r.up.splice(i, 1) : r.up.push(vid); }); },
    async setAnswered(code, id, v) { patchResp(code, id, r => r.answered = v); },
    async clearAll(code) { LS.del(rk(code)); emit(rk(code)); },
    async clearResponses(code, slideId) { LS.setJSON(rk(code), LS.getJSON(rk(code), []).filter(r => r.slideId !== slideId)); emit(rk(code)); }
  };
})();

const FirebaseStore = (() => {
  // ---- Firebase REALTIME DATABASE adapter ----
  // Data layout:  /presentations/{code}            -> presentation (title, slides, live state)
  //               /responses/{code}/{pushId}       -> { slideId, voter, data, ts, up:{voterId:true}, answered }
  let db, offset = 0;
  const load = src => new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
  const P = c => db.ref(c ? 'presentations/' + c : 'presentations');
  const R = c => db.ref('responses/' + c);
  // RTDB stores arrays as objects with numeric keys and drops empty arrays — normalise on read
  const toArr = x => Array.isArray(x) ? x : (x && typeof x === 'object') ? Object.keys(x).sort((a, b) => a - b).map(k => x[k]) : [];
  const isNumObj = x => x && typeof x === 'object' && !Array.isArray(x) && Object.keys(x).length && Object.keys(x).every(k => /^\d+$/.test(k));
  const normP = v => {
    if (!v) return null;
    v.slides = toArr(v.slides).map(sl => { ['options', 'items', 'statements', 'fields'].forEach(k => { if (k in sl || isNumObj(sl[k])) sl[k] = toArr(sl[k]); }); return sl; });
    v.resets = v.resets || {}; v.fffState = v.fffState || {}; return v;
  };
  const normR = (id, r) => {
    const data = r.data || {}; Object.keys(data).forEach(k => { if (isNumObj(data[k])) data[k] = toArr(data[k]); });
    return { id, ...r, data, up: r.up ? Object.keys(r.up) : [], answered: !!r.answered };
  };
  // Surface real problems instead of hanging silently
  const friendly = e => {
    const m = String(e && (e.code || e.message) || e);
    if (/permission/i.test(m)) return new Error('Permission denied — publish the Realtime Database rules (Rules tab), they are still locked.');
    return e instanceof Error ? e : new Error(m);
  };
  const T = (p, what) => Promise.race([
    Promise.resolve(p).catch(e => { throw friendly(e); }),
    new Promise((_, rej) => setTimeout(() => rej(new Error('No reply from Realtime Database while ' + what + '. Check that databaseURL in CONFIG exactly matches the URL on Realtime Database → Data.')), 12000))
  ]);
  const listen = (q, fn) => { const h = q.on('value', fn, e => console.error('Realtime Database:', e.message)); return () => q.off('value', h); };
  return {
    mode: 'firebase',
    now() { return Date.now() + offset; },
    ts() { return firebase.database.ServerValue.TIMESTAMP; },
    async init() {
      const v = '10.12.2';
      await load(`https://www.gstatic.com/firebasejs/${v}/firebase-app-compat.js`);
      await load(`https://www.gstatic.com/firebasejs/${v}/firebase-database-compat.js`);
      firebase.initializeApp(CONFIG.firebaseConfig);
      db = firebase.database();
      // Server clock offset — so every device's countdown and every answer's timestamp agree
      db.ref('.info/serverTimeOffset').on('value', s => { offset = Number(s.val()) || 0; });
    },
    async list() { const s = await T(P().once('value'), 'loading presentations'); return Object.values(s.val() || {}).map(normP).filter(Boolean).sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0)); },
    async get(code) { const s = await T(P(code).once('value'), 'reading a presentation'); return normP(s.val()); },
    async save(p) { await T(P(p.code).update({ ...clone(p), updatedAt: Date.now() }), 'saving'); },
    async update(code, patch) { await T(P(code).update(clone(patch)), 'updating'); },
    async remove(code) { await T(db.ref().update({ ['presentations/' + code]: null, ['responses/' + code]: null }), 'deleting'); },
    watch(code, cb) { return listen(P(code), s => cb(normP(s.val()))); },
    async addResponse(code, slideId, data) { await T(R(code).push({ slideId, voter: voterId(), data: clone(data), ts: firebase.database.ServerValue.TIMESTAMP, answered: false }), 'sending an answer'); },
    watchResponses(code, slideId, cb) { return listen(R(code).orderByChild('slideId').equalTo(slideId), s => cb(Object.entries(s.val() || {}).map(([id, r]) => normR(id, r)))); },
    async toggleUpvote(code, id, vid, has) { await R(code).child(id + '/up/' + vid).set(has ? null : true); },
    async setAnswered(code, id, v) { await R(code).child(id + '/answered').set(!!v); },
    async clearAll(code) { await T(R(code).remove(), 'resetting responses'); },
    async clearResponses(code, slideId) {
      const s = await R(code).orderByChild('slideId').equalTo(slideId).once('value');
      const u = {}; s.forEach(ch => { u[ch.key] = null; });
      if (Object.keys(u).length) await R(code).update(u);
    }
  };
})();

// Morph keeps existing DOM nodes when only values change, so bars animate smoothly.
function morph(el, key, html) {
  if (el.dataset.mkey === key) {
    const tmp = document.createElement('div'); tmp.innerHTML = html;
    const nn = $$('[data-k]', tmp);
    const old = new Map($$('[data-k]', el).map(n => [n.dataset.k, n]));
    let same = nn.length === old.size && nn.every(n => old.has(n.dataset.k));
    if (same) {

    html = `<div class="ff-state"><span class="em">⏰</span><h2>Time up!</h2><p><b style="color:var(--ink)" data-k="ffn" data-text>${answered}</b> answer${answered === 1 ? '' : 's'} locked in${st.presenter ? ' · press <b style="color:var(--ink)">🏆 Show results</b> to reveal who was fastest' : ''}</p></div>`;
  } else {
    const ranked = fffRanked(slide, res, start);
    key += ':' + ranked.map(r => r.id).join(',');
    const ct = fffCorrectText(slide);
    html = `${ct ? `<div style="text-align:center"><span class="ff-correct">✓ Correct answer: ${esc(ct)}</span></div>` : ''}${fffBoard(slide, ranked)}`;
  }
  return { key, html };
}

/* Sample data for the editor preview */
function sampleResponses(slide) {
  const R = seeded(hashStr(slide.id + slide.type + JSON.stringify(slide).length)); const ri = n => Math.floor(R() * n);
  const N = 14, out = [];
  const words = ['curious', 'fun', 'robots', 'creative', 'teamwork', 'coding', 'awesome', 'wow', 'learning', 'smart', 'sensors', 'fun', 'curious', 'robots', 'fun'];
  const texts = ['Building the line follower was amazing!', 'I finally understood how sensors work', 'Loved the teamwork', 'Can we do more coding?', 'The demo was so cool', 'Design thinking helps me plan better'];
  for (let k = 0; k < N; k++) {
    const id = 's' + k; let data;
    switch (slide.type) {
      case 'mc': data = { choices: [Math.min(ri(slide.options.length + 1), slide.options.length - 1)] }; break;
      case 'wordcloud': data = { words: [words[ri(words.length)], words[ri(words.length)]] }; break;
      case 'open': data = { text: texts[k % texts.length] }; if (k > 5) continue; break;
      case 'scales': data = { values: slide.statements.map(() => slide.min + ri(slide.max - slide.min + 1)) }; break;
      case 'ranking': { const o = [...slide.items.keys()]; for (let i = o.length - 1; i > 0; i--) { const j = ri(i + 1); [o[i], o[j]] = [o[j], o[i]]; } data = { order: o }; break; }
      case 'qa': if (k > 3) continue; data = { text: ['How do I start learning robotics at home?', 'Which microcontroller is best for beginners?', 'Can we use AI in our school project?', 'What sensors does a smart car need?'][k] }; break;
      case 'guess': data = { value: clamp(Math.round(slide.correct + (R() + R() + R() - 1.5) * (slide.max - slide.min) / 4), slide.min, slide.max) }; break;
      case 'points': { let left = slide.budget; data = { points: slide.items.map((_, i, a) => { const v = i === a.length - 1 ? left : ri(left + 1); left -= v; return v; }) }; break; }
      case 'grid': data = { xy: slide.items.map(() => ({ x: slide.gmin + R() * (slide.gmax - slide.gmin), y: slide.gmin + R() * (slide.gmax - slide.gmin) })) }; break;
      case 'form': if (k > 3) continue; data = { values: slide.fields.map(f => f.type === 'textarea' ? 'More hands-on time please!' : 'Sample answer') }; break;
      case 'pin': data = { x: 20 + R() * 60, y: 25 + R() * 50 }; break;
      case 'fff': { if (k > 7) continue; const nm = ['Aarav', 'Diya', 'Kabir', 'Ananya', 'Rohan', 'Meera', 'Ishaan', 'Sana'][k];
        if (slide.mode === 'mc') data = { name: nm, choice: ri(slide.options.length) };
        else if (slide.mode === 'buzzer') data = { name: nm, buzz: true };
        else if (slide.mode === 'order') data = { name: nm, order: k % 3 === 1 ? fffShuffle((slide.items || []).length, k + 7) : [...(slide.items || []).keys()] };
        else if (slide.mode === 'open') data = { name: nm, text: texts[k % texts.length] };
        else { data = { name: nm, text: (slide.answer || 'Answer').split(',')[0].trim() || 'Answer' }; if (k % 3 === 2) data.text = 'Not sure'; }
        break; }
    }
    out.push({ id, slideId: slide.id, voter: 'v' + k, data, ts: slide.type === 'fff' ? 700 + k * 900 + ri(500) : k, up: Array(ri(6)).fill('x'), answered: false });
  }
  return out;
}

function viewEditor(code) {

  addEventListener('beforeunload', onBefore); cleanups.push(() => removeEventListener('beforeunload', onBefore));
  const onKey = e => { if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); save(); } };
  addEventListener('keydown', onKey); cleanups.push(() => removeEventListener('keydown', onKey));

  function paint() {
    app.innerHTML = `<div class="ed">
      <header class="ed-top">
        <button class="btn sm ghost" id="back">← Back</button>

        <div style="flex:1"></div>
        <button class="btn sm" id="save">💾 Save</button>
        <button class="btn sm primary" id="present">▶ Present</button>
      </header>
      <aside class="ed-side" id="side"></aside>
      <main class="ed-main"><div class="canvas-bar"><span class="q-chip" id="cchip"></span>
        <label class="chk" style="margin:0"><input type="checkbox" id="sample" ${sample ? 'checked' : ''}> Preview with sample answers</label></div>
        <div class="canvas card" id="canvas"></div></main>
      <aside class="ed-panel" id="panel"></aside></div>`;
    $('#back').onclick = async () => { if (ed.dirty && !(await confirmBox('Leave without saving?', 'You have unsaved changes.', 'Leave'))) return; ed.dirty = false; go('presenter'); };
    $('#title').oninput = e => { ed.p.title = e.target.value; dirty(); };
    $('#save').onclick = save;
    $('#present').onclick = async () => { if (await save()) go('present/' + ed.p.code); };
    $('#sample').onchange = e => { sample = e.target.checked; paintCanvas(); };
    paintSide(); paintCanvas(); paintPanel();
  }
  function dirty() { ed.dirty = true; const s = $('#ss'); if (s) { s.classList.add('dirty'); s.lastElementChild.textContent = 'Unsaved changes'; } }
  function validate() {
    for (const [i, s] of ed.p.slides.entries()) {
      const bad = m => { ed.sel = i; paintSide(); paintCanvas(); paintPanel(); toast(`Slide ${i + 1}: ${m}`, 'err'); return false; };
      if (s.type !== 'blank' && !String(s.question || '').trim()) return bad('add a question');
      if (['mc', 'ranking', 'points'].includes(s.type) && (s[s.type === 'mc' ? 'options' : 'items'].filter(x => x.trim()).length < 2)) return bad('add at least 2 options');
      if (s.type === 'scales' && (!s.statements.length || s.min >= s.max)) return bad('needs statements and min < max');
      if (s.type === 'grid' && (!s.items.length || s.gmin >= s.gmax)) return bad('needs items and min < max');
      if (s.type === 'guess' && !(s.min < s.max && s.correct >= s.min && s.correct <= s.max)) return bad('min < max and the answer must be in range');
      if (s.type === 'points' && !(s.budget > 0)) return bad('points budget must be positive');
      if (s.type === 'form' && !s.fields.length) return bad('add at least one field');
      if (s.type === 'fff' && s.mode === 'mc' && s.options.length < 2) return bad('add at least 2 options');
      if (s.type === 'fff' && s.mode === 'order' && (s.items || []).length < 2) return bad('add at least 2 words or steps to arrange');
      if (s.type === 'fff' && !(Number(s.timeLimit) >= 3)) return bad('time limit must be at least 3 seconds');
    }

  }
  async function save() {
    if (saving) return false;

    ed.p.slides.forEach(s => { if (s.type === 'fff' && s.correct >= (s.options || []).length) s.correct = -1; });
    if (!validate()) return false;
    saving = true;

      const cur = await Store.get(ed.p.code) || {};

  function paintSide() {

  function bindPanel() {
    const panel = $('#panel'), s = cur();
    panel.oninput = e => {
      const t = e.target;

      else if (t.dataset.delL) { if (s[t.dataset.delL].length <= 1) return toast('Keep at least one', 'err'); const di = +t.dataset.i; s[t.dataset.delL].splice(di, 1);

        dirty(); paintPanel(); paintCanvas(); }
      else if (t.hasAttribute('data-add-f')) { s.fields.push({ label: '', type: 'text', req: false }); dirty(); paintPanel(); paintCanvas(); }
      else if (t.dataset.delF !== undefined) { if (s.fields.length <= 1) return toast('Keep at least one field', 'err'); s.fields.splice(+t.dataset.delF, 1); dirty(); paintPanel(); paintCanvas(); }

    };

}
function pickType(cb) {
  const m = modal(`<h3>Add a slide</h3><p class="sub">Choose an interactive question type — or a blank welcome slide</p>
    <div class="type-pick">${EDIT_TYPES().map(t => `<button data-t="${t}">${ticon(t)}<div>${TYPES[t].name}<small>${TYPES[t].desc}</small></div></button>`).join('')}</div>`, { wide: true });
  $$('[data-t]', m.el).forEach(b => b.onclick = () => { m.close(); cb(b.dataset.t); });
}
function compressImage(file, maxW = 1000, q = .78) {
  return new Promise((res, rej) => {
    const fr = new FileReader(); fr.onerror = rej;
    fr.onload = () => { const img = new Image(); img.onerror = rej; img.onload = () => {
      const k = Math.min(1, maxW / img.width), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(img, 0, 0, c.width, c.height);
      res(c.toDataURL('image/jpeg', q)); }; img.src = fr.result; };
    fr.readAsDataURL(file);
  });
}

function viewPresent(code) {

    if (!np) { toast('Presentation not found', 'err'); return go('presenter'); }

    } else if (s.id !== slideId) {

  cleanups.push(() => { unsubP && unsubP(); unsubR && unsubR(); Store.update(code, { live: false }).catch(() => {}); });
  const onKey = e => {
    if (!p || e.target.matches('input,textarea')) return;
    if (['ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); nav(1); }
    if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); nav(-1); }
    if (e.key.toLowerCase() === 'h') Store.update(code, { hideResults: !p.hideResults });
    if (e.key.toLowerCase() === 'f') toggleFs();

  cleanups.push(() => clearInterval(tick));
  function fffPhase(s) { const fs = (p.fffState || {})[s.id] || {}; return fs.shown ? 'shown' : !fs.start ? 'idle' : Store.now() < fs.start + fffLimit(s) ? 'run' : 'up'; }
  function setFS(s, patch) { const all = { ...(p.fffState || {}) }; all[s.id] = { ...(all[s.id] || {}), ...patch }; return Store.update(code, { fffState: all }); }
  function nav(d) {

  /* ---------- Fastest Fingers First (participant) ---------- */
  function fff(s, reset) {
    const am = $('#am'), fs = (p.fffState || {})[s.id] || {}, lim = fffLimit(s), vk = votedKey(s, reset), name = LS.get(nameKey) || 'Anonymous';
    const left = () => (fs.start || 0) + lim - Store.now();
    const who = changeable => `<div class="who">⚡ Playing as <b style="color:var(--ink)">${esc(name)}</b>${changeable ? ' · <button id="chName">change</button>' : ''}</div>`;

    if (fs.shown) return fffResults(s, fs);
    if (!fs.start) {
      am.innerHTML = `<div class="card aud-card">${head(s)}${who(true)}<div class="ff-state" style="padding:20px 0"><span class="em">🏁</span><h2 style="font-size:28px">Get ready!</h2>

          : `Answers open when the presenter starts the timer.<br>You'll have <b style="color:var(--ink)">${lim / 1000} seconds</b> — be quick! ${s.mode === 'mc' ? 'One tap answers.' : s.mode === 'order' ? 'Tap the pieces in the right order.' : ''}`}</p></div></div>`;
      return bindWho();
    }
    const clock = `<div class="ff-clock"><div class="ff-track"><div class="ff-fill" id="ffBar" style="width:${Math.max(0, left() / lim * 100)}%"></div></div><b id="ffSec">${Math.max(0, Math.ceil(left() / 1000))}s</b></div>`;
    const runTick = (onEnd) => { stopTick(); ffTick = setInterval(() => { const l = left();
      const bar = $('#ffBar'), sec = $('#ffSec');
      if (bar) bar.style.width = Math.max(0, l / lim * 100) + '%';
      if (sec) { sec.textContent = Math.max(0, Math.ceil(l / 1000)) + 's'; sec.classList.toggle('low', l <= 5000); }
      if (l <= 0) { stopTick(); onEnd(); } }, 100); };
    const timeUp = msg => { am.innerHTML = `<div class="card aud-card">${head(s)}<div class="ff-state"><span class="em">⏰</span><h2>Time up!</h2><p>${msg}</p>
      <p style="margin-top:10px">Results appear when the presenter reveals them <span class="dots"><i></i><i></i><i></i></span></p></div></div>`; };
    const mine = LS.get(vk);
    if (mine !== null && s.mode === 'buzzer') return buzzed(s, fs, Number(mine), left, runTick);
